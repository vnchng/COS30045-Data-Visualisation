<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Healthcare Expenditure Visualisation</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Healthcare Expenditure by Provider</h1>

    <h2>Healthcare Expenditure by Provider Across Countries</h2>

    <!-- Year filter -->
    <label for="yearSelect">Year:</label>

    <select id="yearSelect">
        <option value="2015">2015</option>
        <option value="2016">2016</option>
        <option value="2017">2017</option>
        <option value="2018">2018</option>
        <option value="2019">2019</option>
        <option value="2020">2020</option>
        <option value="2021">2021</option>
        <option value="2022">2022</option>
        <option value="2023" selected>2023</option>
        <option value="2024">2024</option>
        <option value="2025">2025</option>
    </select>

    <!-- Country filter -->
    <div id="countryFilter">

    <label><strong>Countries:</strong></label>

    <button id="countryDropdown" type="button">
        Select countries ▼
    </button>

    <div id="countryMenu">
        <div id="countryButtons"></div>

        <button id="selectAll" type="button">Select All</button>
        <button id="clearAll" type="button">Clear</button>
    </div>

    <div id="selectedCountries"></div>

    </div>

    <!-- Chart -->
    <div id="stackedChart"></div>

    <!-- Tooltip -->
    <div id="tooltip"></div>

    <script src="js/healthExpenditureStackedBar.js"></script>
    <div id="tooltip"></div>
</body>

</html>
